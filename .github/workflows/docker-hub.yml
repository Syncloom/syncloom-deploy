name: Docker Hub

# Only a pushed version tag publishes. Tags can only be created by people who may write to this repository
# (see the tag ruleset), and the credentials live in the "dockerhub" environment, which only accepts v* tags.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: CI
    uses: ./.github/workflows/ci.yml

  # One job per image and CPU architecture, each on a native runner (a Rust build under QEMU would take hours).
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        image: [syncloom-server, syncloom-web]
        arch: [amd64, arm64]
        include:
          - image: syncloom-server
            dockerfile: server.Dockerfile
          - image: syncloom-web
            dockerfile: web.Dockerfile
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: syncloom-deploy
          persist-credentials: false
      - uses: ./syncloom-deploy/.github/actions/workspace
        with:
          tag: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: syncloom-deploy/${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-architecture images into one multi-arch tag.
  publish:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    environment: dockerhub
    env:
      NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        image: [syncloom-server, syncloom-web]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create the multi-arch tags
        env:
          IMAGE: ${{ matrix.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          # a SemVer pre-release carries a hyphen (0.2.0-rc1) and moves beta-latest, not latest
          if [[ "$version" == *-* ]]; then moving=beta-latest; else moving=latest; fi
          cd "$RUNNER_TEMP/digests"
          docker buildx imagetools create -t "$NAMESPACE/$IMAGE:$version" -t "$NAMESPACE/$IMAGE:$moving" $(printf "$NAMESPACE/$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$NAMESPACE/$IMAGE:$version"
      - name: Check the Docker Hub description fits
        env:
          DESCRIPTION: docker/${{ matrix.image }}.md
        run: |
          bytes=$(wc -c < "$DESCRIPTION")
          echo "$DESCRIPTION is $bytes bytes (Docker Hub allows 25000)"
          [ "$bytes" -le 25000 ] || { echo "::error file=$DESCRIPTION::over Docker Hub's 25000-byte limit"; exit 1; }
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/${{ matrix.image }}
          short-description: "${{ matrix.image == 'syncloom-server' && 'Syncloom server: encrypted file sync and key/value storage (Rust)' || 'Syncloom web app: end-to-end encrypted files in the browser (nginx)' }}"
          readme-filepath: ./docker/${{ matrix.image }}.md
