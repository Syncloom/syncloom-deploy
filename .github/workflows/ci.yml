name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # docker-hub.yml calls this as a gate, so a tag only reaches Docker Hub if its images build.
  workflow_call: {}

permissions:
  contents: read

jobs:
  images:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: syncloom-server
            dockerfile: server.Dockerfile
          - image: syncloom-web
            dockerfile: web.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: syncloom-deploy
          persist-credentials: false
      - uses: ./syncloom-deploy/.github/actions/workspace
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: syncloom-deploy/${{ matrix.dockerfile }}
          push: false
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
