# Syncloom: server + web + Postgres behind Caddy (automatic HTTPS).
#   cp .env.example .env   # set SYNCLOOM_DOMAIN and POSTGRES_PASSWORD
#   docker compose up -d      # pulls the published images from Docker Hub
name: syncloom

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncloom
      POSTGRES_DB: syncloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncloom -d syncloom"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: svenwal/syncloom-server:${SYNCLOOM_VERSION:-0.1.3}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      files-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://syncloom:${POSTGRES_PASSWORD}@db:5432/syncloom
      # WebAuthn (security keys) and OIDC need to know the public address
      PUBLIC_URL: https://${SYNCLOOM_DOMAIN:?set SYNCLOOM_DOMAIN in .env}
      BLOB_BACKEND: ${BLOB_BACKEND:-fs}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      LOCAL_AUTH: ${LOCAL_AUTH:-true}
    volumes:
      - ${SYNCLOOM_FILES_DIR:-./files}:/data

  # the files folder is created by Docker as root: hand it to the server user (uid 10001) once before start
  files-init:
    image: svenwal/syncloom-server:${SYNCLOOM_VERSION:-0.1.3}
    user: "0"
    entrypoint: ["sh", "-c", "mkdir -p /data/blobs && chown 10001 /data /data/blobs"]
    volumes:
      - ${SYNCLOOM_FILES_DIR:-./files}:/data

  web:
    image: svenwal/syncloom-web:${SYNCLOOM_VERSION:-0.1.3}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
      - web
    ports:
      # HTTP_PORT, HTTP_BIND: port and address on which port 80 (redirect and Let's Encrypt) is published on this host.
      # HTTPS_PORT: must equal the port in SYNCLOOM_DOMAIN (443 when it has none, 7777 for "host:7777").
      - "${SYNCLOOM_HTTP_BIND:-0.0.0.0}:${SYNCLOOM_HTTP_PORT:-80}:80"
      - "${SYNCLOOM_HTTPS_PORT:-443}:${SYNCLOOM_HTTPS_PORT:-443}"
      - "${SYNCLOOM_HTTPS_PORT:-443}:${SYNCLOOM_HTTPS_PORT:-443}/udp"
    environment:
      SYNCLOOM_DOMAIN: ${SYNCLOOM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
